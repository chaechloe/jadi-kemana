# Runs the syntax check and unit tests (npm test, the same command as on your computer) on every
# push to dev and main and on pull requests, so a red cross shows up before anything goes live.
# No dependencies to install.
name: Tests

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax check and unit tests
        run: npm test
