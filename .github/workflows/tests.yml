# Runs the syntax check and unit tests on every pull request and on main,
# so a green tick shows up before anything is merged. No dependencies to install.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax check
        run: for f in js/*.js js/views/*.js tools/*.mjs; do node --check "$f"; done
      - name: Unit tests
        run: node --test "tests/*.test.mjs"
